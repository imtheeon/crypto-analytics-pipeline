name: crypto-views-refresh

# The BigQuery sandbox expires views 60 days after they're created. Re-creating them monthly resets the clock.
on:
  schedule:
    - cron: "0 6 1 * *"  # 06:00 UTC on the 1st of each month
  workflow_dispatch:

permissions:
  contents: read

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      # Pinned to a commit: this action receives the service account key. v3.0.0
      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093  # sets GOOGLE_APPLICATION_CREDENTIALS
        with:
          credentials_json: ${{ secrets.CRYPTO_GCP_KEY }}
      - name: Re-create views (dependency order)
        run: |
          python - <<'EOF'
          from datetime import datetime, timedelta, timezone
          from pathlib import Path
          from google.cloud import bigquery
          client = bigquery.Client(project="crypto-analytics-pipeline-lc")
          for f in ["sql/clean/crypto_clean_prices.sql", "sql/metrics/crypto_anomaly_config.sql",
                    "sql/metrics/crypto_metrics_prices.sql", "sql/metrics/crypto_rank_hourly.sql"]:
              client.query(Path(f).read_text()).result()
          # Fail the run if any view still expires within 55 days, i.e. the reset didn't happen.
          soon = datetime.now(timezone.utc) + timedelta(days=55)
          for v in ["crypto_clean.prices", "crypto_metrics.anomaly_config",
                    "crypto_metrics.prices", "crypto_metrics.rank_hourly"]:
              expires = client.get_table(f"crypto-analytics-pipeline-lc.{v}").expires
              print(f"{v} expires {expires or 'never'}")
              assert expires is None or expires > soon, f"{v} still expires {expires}"
          EOF
